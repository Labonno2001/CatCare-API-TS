services:
  - type: web
    name: catcare-api-ts
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: commit

    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start

    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production

      - key: DATABASE_PATH
        value: /tmp/catcare.db
